server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # La carga de eventos es solo para el cargador (add-event.js, dentro del contenedor api): no se publica en internet.
  location /api/admin/ {
    return 404;
  }

  # La API y las imágenes de los eventos son del contenedor "api": un solo origen para la web.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 64k;
  }

  location /media/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  # El service worker (notificaciones push) y el HTML nunca se cachean: una versión nueva tiene que llegar enseguida.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Los archivos con hash en el nombre no cambian nunca.
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
