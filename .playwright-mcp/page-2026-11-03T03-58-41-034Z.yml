                - generic [ref=f22e198]: Mié 28/10 · 18:00 · Salón de las Américas, UNLaM
                - generic [ref=f22e199]: "Se presentan los proyectos de fin de carrera de alumnos de ingenierías, tecnicaturas y escuelas secundarias de la zona, con competencia de programación y charlas sobre IA, robótica, diseño de satélites, becarios tecnológicos, computación cuántica y más. Miércoles 28, jueves 29 y viernes 30 de octubre de 2026, de 18 a 21 h. Cronograma de charlas Miércoles 28 - 18:00 Cómo se diseña un satélite desde cero. BEAM-TTM y los desafíos de la ingeniería (Aula 303). - 18:30 ¿Puede la IA crear un robot? BEAM y el futuro de la robótica (Aula 303). - 19:00 Computación cuántica, con la Ing. Giselle González, docente del DIIT (Auditorio CeDIT). Jueves 29 - 18:00 Becas Tecnológicas: beneficios para tu presente y tu futuro, con becarios tecnológicos de empresas del CeDIT (Auditorio CeDIT). - 18:30 Ingeniería para la inclusión: diseño integral y sustentable de espacios productivos en San Francisco de Asís, con Vivian Jeandet (Aula 301). - 19:30 Motorsport UNLaM: situación actual y desafíos futuros en el desarrollo de un vehículo eléctrico de competición, con los Ings. George Faks y Leonardo Medina (Aula 303). Viernes 30 - 14 a 18 h Teclatón en los Laboratorios 3 y 4 (Centro de Estudiantes). - 18:00 Octubre360. Hablemos. Midamos. Actuemos, con la Ing. Liliana Mira (Auditorio CeDIT). - 19:00 Regionalización de precipitaciones máximas diarias en la zona oeste del Gran Buenos Aires, con el Ing. Pablo Espiñeira (Aula 245). - 20:00 Cierre de ExpoProyecto 2026 y premiación de proyectos ganadores de ingenierías, tecnicaturas y escuelas (Salón de las Américas)."
