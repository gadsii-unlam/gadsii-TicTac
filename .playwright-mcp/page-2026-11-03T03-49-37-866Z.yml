          - paragraph [ref=f20e37]: El objetivo de este curso es brindar a los participantes los conocimientos fundamentales para comprender su consumo de energía y aplicar prácticas de eficiencia que permitan reducir costos, optimizar recursos y mejorar el desempeño energético, principalmente en el ámbito doméstico, e introductoriamente en el comercial e industrial.
