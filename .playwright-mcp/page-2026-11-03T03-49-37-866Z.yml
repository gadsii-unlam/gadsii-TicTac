          - generic [ref=f20e84]:
            - generic [ref=f20e85]:
              - generic [ref=f20e86]:
                - generic [ref=f20e87]: LM
                - generic [ref=f20e89]: Leandro Magri
              - paragraph [ref=f20e92]: Ingeniero Químico, especializado en energías renovables y eficiencia energética. Maestrando en Energías Renovables (UTN). Posgrado en Dirección de Empresas PYME (UCA). Cuenta con experiencia laboral en tratamiento de aguas y efluentes, servicios industriales y control de procesos. Fundador y Director General de Colectando Sol, empresa de triple impacto con más de una década de experiencia en energía solar y eficiencia energética, a través de instalaciones, capacitaciones y proyectos sociales en todo el país, otros países de Latinoamérica e incluso la Antártida. Asesor, Docente e Investigador del DIIT-UNLaM. Docente UNSAM.
            - generic [ref=f20e93]:
              - generic [ref=f20e94]:
                - generic [ref=f20e95]: AL
                - generic [ref=f20e97]: Agustín Lohigorry
              - paragraph [ref=f20e100]: Licenciado en Análisis de Sistemas (UBA). Magíster en Dirección Estratégica y Tecnológica (ITBA-EOI). Diplomado en Gestión Eficiente de la Energía / Energy Manager (ITBA-EUREM) y en Tecnología y Gestión de la Energía (UTN). Diplomado en Hidrógeno Verde (Clase Ejecutiva UC Chile). Cursa la Especialización en Energías Renovables, Eficiencia Energética y Cambio Climático (UBA–CEARE). Responsable de Proyectos y Comercial de RAYO. Co coordinador del área de Energía e integrante de la comisión directiva de Ingeniería Sin Fronteras Argentina. Asesor, Docente e Investigador del DIIT-UNLaM. Especialista en Transición Energética.
