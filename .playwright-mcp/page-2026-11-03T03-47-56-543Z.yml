          - generic [ref=e70]:
            - paragraph [ref=e71]: "Departamento de Ingeniería e Investigaciones Tecnológicas de la Universidad Nacional de La Matanza Visión: Promover un proceso integral de formación de excelencia en el campo profesional de la ingeniería, especialmente orientada a las Tecnologías de la Información y de la Comunicación; con particular atención en las necesidades, problemas y requerimientos planteados a la profesión, tanto locales como regionales e internacionales. Misión: Formar profesionales de la ingeniería comprometidos con el entorno social y productivo, destacados por su formación teórica y sus experiencias prácticas, capaces de formular y desarrollar proyectos innovadores en los diversos ámbitos de sus desempeños."
